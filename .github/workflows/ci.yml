# CI (ADR-0013): builds and tests the core on Linux, macOS and Windows on every push/PR.
# What CI cannot verify: real Epson scans, real-window rendering, display colour accuracy and the 8 GB
# device tier — see docs/HUMAN-VERIFICATION.md.
name: CI

on:
  push:
    branches: [main, "phase-*", "feature/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  docs:
    name: Docs and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Relative links in Markdown resolve
        run: python3 tools/check-docs.py
      - name: No large or forbidden files tracked
        run: python3 tools/check-repo.py
      - name: Third-party licences listed
        run: python3 tools/check-licenses.py
      - name: No network APIs in product code (offline guarantee)
        run: python3 tools/check-no-network.py
      - name: clang-format
        run: tools/check-format.sh
      - name: Every UI string translated (zh_CN)
        run: python3 tools/check-i18n.py
      - name: App icons complete, no sun (UX-11)
        run: python3 tools/check-icons.py

  core:
    name: Core ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: CMake (pinned)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Toolchain id (dependency cache key)
        id: tc
        # static deps record absolute SDK paths (e.g. libm.tbd inside one Xcode), so a cache is only valid for the
        # runner image and SDK it was built with
        run: |
          if [ "$RUNNER_OS" = macOS ]; then id="${ImageOS}-$(xcrun --show-sdk-path | sed 's#.*/##; s#[^A-Za-z0-9.]#_#g')-$(xcode-select -p | sed 's#/Contents/Developer##; s#.*/##')"
          else id="${ImageOS:-unknown}"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "toolchain id: $id"
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-install
          key: deps-core-${{ matrix.name }}-${{ steps.tc.outputs.id }}-${{ hashFiles('cmake/deps/**') }}
      - name: Build dependencies (superbuild, pinned tags)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/deps -B build/deps -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFK_DEPS_PREFIX="$PWD/build/deps-install" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build/deps
      - name: Configure (core + tools + tests, no app)
        run: |
          set -o pipefail
          mkdir -p build
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_BUILD_APP=OFF -DFK_WERROR=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-install" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 2>&1 | tee build/core-configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/ci -- -k 0 2>&1 | tee build/ci/build.log
      - name: Configure/build errors as annotations
        if: failure()
        run: |
          for f in build/core-configure.log build/ci/build.log; do
            [ -f "$f" ] && { python3 tools/ci-annotate.py "$f" || python tools/ci-annotate.py "$f"; }
          done
          true
      - name: Test (executed/skipped/duration report)
        id: test
        run: |
          set -o pipefail
          tools/run-tests.sh build/ci 2>&1 | tee build/ci/test.log
      - name: Test failures as annotations
        if: failure() && steps.test.outcome == 'failure'
        run: |
          python3 tools/ci-annotate.py build/ci/test-report.xml || python tools/ci-annotate.py build/ci/test-report.xml
          python3 tools/ci-annotate.py build/ci/test.log || python tools/ci-annotate.py build/ci/test.log
      # FK-012 (U026): the exported Linear DNG decoded by an independent decoder (LibRaw via rawpy, test-only,
      # installed in a venv) and compared with the 16-bit TIFF export of the same image area
      - name: Linear DNG decoded independently (FK-012)
        id: dng
        if: matrix.name == 'linux-x64'
        run: |
          python3 -m venv build/dng-venv
          build/dng-venv/bin/pip install --quiet "rawpy>=0.21" numpy tifffile imagecodecs
          build/dng-venv/bin/python tools/dng-interop.py --fkcli build/ci/bin/fkcli --fkfixture build/ci/bin/fkfixture \
            --out build/dng-interop --json build/dng-interop/report.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-core-${{ matrix.name }}
          path: build/ci/test-report.xml
          if-no-files-found: warn

  app:
    name: App ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: macos-arm64
            os: macos-15
            qt_arch: clang_64
          - name: windows-x64
            os: windows-2022
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: CMake (pinned)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Toolchain id (dependency cache key)
        id: tc
        # static deps record absolute SDK paths (e.g. libm.tbd inside one Xcode), so a cache is only valid for the
        # runner image and SDK it was built with
        run: |
          if [ "$RUNNER_OS" = macOS ]; then id="${ImageOS}-$(xcrun --show-sdk-path | sed 's#.*/##; s#[^A-Za-z0-9.]#_#g')-$(xcode-select -p | sed 's#/Contents/Developer##; s#.*/##')"
          else id="${ImageOS:-unknown}"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "toolchain id: $id"
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-install
          key: deps-app-${{ matrix.name }}-${{ steps.tc.outputs.id }}-${{ hashFiles('cmake/deps/**') }}
      - name: Build dependencies (superbuild, pinned tags)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/deps -B build/deps -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_DEPS_WITH_TESTS=OFF \
            -DFK_DEPS_PREFIX="$PWD/build/deps-install" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build/deps
      - name: Configure (app + tools)
        run: |
          set -o pipefail
          # a ';' list is not converted by Git Bash on Windows, so pass CMake-style paths (C:/…) explicitly
          np() { if command -v cygpath > /dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          mkdir -p build
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_BUILD_APP=ON -DFK_BUILD_TESTS=OFF \
            -DFK_WERROR=ON "-DCMAKE_PREFIX_PATH=$(np "$PWD/build/deps-install");$(np "$QT_ROOT_DIR")" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 2>&1 | tee build/app-configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/app -- -k 0 2>&1 | tee build/app-build.log
      - name: Configure/build errors as annotations
        if: failure()
        run: |
          for f in build/app-configure.log build/app-build.log; do
            [ -f "$f" ] && { python3 tools/ci-annotate.py "$f" || python tools/ci-annotate.py "$f"; }
          done
          true
      - name: Self-test (offscreen, real controllers, snapshots)
        id: selftest
        env:
          # Windows: a GUI program's qInfo() goes to the debugger, not to the piped stderr; keep PASS/FAIL lines
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          set -o pipefail
          build/app/bin/fkfixture --out build/selftest-scan.tif --dpi 300 --count 3 --seed 3 --bits 16
          case "$RUNNER_OS" in
            macOS) APP=build/app/bin/FrameKeeper.app/Contents/MacOS/FrameKeeper ;;
            Windows) APP=build/app/bin/FrameKeeper.exe ;;
            *) APP=build/app/bin/FrameKeeper ;;
          esac
          FK_SETTINGS_DIR="$PWD/build/selftest-settings" QT_QPA_PLATFORM=offscreen \
            "$APP" --self-test "$PWD/build/selftest" --scan "$PWD/build/selftest-scan.tif" 2>&1 | tee build/selftest.log
          # FK-011 (U025): MinIsWhite grey scans, 8- and 16-bit: Preview and Full show the same brightness
          for b in 8 16; do
            build/app/bin/fkfixture --out build/selftest-miw$b.tif --dpi 300 --count 2 --seed 4 --channels 1 --miniswhite --bits $b
            QT_QPA_PLATFORM=offscreen "$APP" --self-test "$PWD/build/selftest/miniswhite$b" --scan "$PWD/build/selftest-miw$b.tif" \
              --scenario miniswhite 2>&1 | tee -a build/selftest.log
          done
          # FK-009 (U024): text and layout checks also in Chinese and at 1.5× / 2× (English 1× ran above)
          for v in "zh_CN 1" "zh_CN 2" "en 1.5"; do
            set -- $v
            d="$PWD/build/text-$1-$2"; mkdir -p "$d/settings"
            printf '[app]\nlanguage=%s\n' "$1" > "$d/settings/settings.ini"
            FK_SETTINGS_DIR="$d/settings" QT_SCALE_FACTOR=$2 QT_QPA_PLATFORM=offscreen "$APP" --self-test "$d" \
              --scan "$PWD/build/selftest-scan.tif" --scenario text 2>&1 | tee -a build/selftest.log
          done
      - name: Self-test failures as annotations
        if: failure() && steps.selftest.outcome == 'failure'
        run: python3 tools/ci-annotate.py build/selftest.log || python tools/ci-annotate.py build/selftest.log
      # FK-005 measurement (not a gate; the gates are the self-test's FK-005 checks): the same 20-scan corpus
      # on every OS, batches of 5 and 20, memory after each stage (RSS, private bytes, accounted, cache); the
      # budget is sized for an 8 GB device on every runner (FK_ASSUME_RAM_GB=8 → 512 MB) so the runs compare
      - name: Memory batch (FK-005)
        id: memory
        if: always() && steps.selftest.outcome == 'success'
        run: |
          set -o pipefail
          build/app/bin/fkfixture --corpus 20 --out-dir build/memcorpus --seed 18 --dpis 300 --bits 8 \
            --compression deflate --predictor 2
          case "$RUNNER_OS" in
            macOS) APP=build/app/bin/FrameKeeper.app/Contents/MacOS/FrameKeeper ;;
            Windows) APP=build/app/bin/FrameKeeper.exe ;;
            *) APP=build/app/bin/FrameKeeper ;;
          esac
          for n in 5 20; do
            FK_ASSUME_RAM_GB=8 FK_BENCH_SCANS=$n QT_QPA_PLATFORM=offscreen "$APP" --self-test "$PWD/build/memory/n$n" \
              --scenario memory \
              --scan "$PWD/build/memcorpus" > build/memory-n$n.log 2>&1
          done
          for n in 5 20; do [ -f build/memory/n$n/scenario-memory.json ] || { echo "::warning title=FK-005 memory::batch of $n produced no report"; tail -20 build/memory-n$n.log; }; done
          python3 tools/memory-summary.py build/memory/n5/scenario-memory.json build/memory/n20/scenario-memory.json \
            --markdown-out "$GITHUB_STEP_SUMMARY" --annotate "$RUNNER_OS" || python tools/memory-summary.py \
            build/memory/n5/scenario-memory.json build/memory/n20/scenario-memory.json \
            --markdown-out "$GITHUB_STEP_SUMMARY" --annotate "$RUNNER_OS"
      - name: Upload memory batch
        if: always() && steps.memory.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.name }}
          path: |
            build/memory/*/scenario-memory.json
            build/memory-n*.log
          if-no-files-found: warn
      - name: Upload self-test report and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.name }}
          path: build/selftest/
          if-no-files-found: warn
