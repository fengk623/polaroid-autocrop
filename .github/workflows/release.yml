# Release (ADR-0013, RELEASE-CHECKLIST.md, docs/v1/PLAN.md §Release): builds the app on macOS (universal) and
# Windows (x64), packages a DMG, a portable ZIP and an installer with BUILDINFO.txt, runs the packaged app's
# self-test and checks that it reports the package's version and commit.
# - Pull requests to main and to unit branches (stacked units, PLAN §2): test packages of the PR head commit
#   (artifacts only, nothing is published), checked as the user receives them (FK-014): the DMG mounted and its app
#   copied and run; the ZIP unpacked and run; the installer installed, upgraded from every published release,
#   rolled back, upgraded again and uninstalled on the clean runner, with the user's data checked after each step.
# - Manual run on main with "publish": creates tag v<VERSION> at that commit and a GitHub release (pre-release when
#   VERSION has a pre-release suffix), refuses to overwrite an existing tag or release, and verifies the published
#   files against SHA256SUMS. Builds are not code-signed (docs/INSTALL.md explains the first launch).
name: Release

on:
  pull_request:
    branches: [main, "unit/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create tag v<VERSION> and publish the GitHub release (pre-release for x.y.z-suffix)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"
  # provenance compiled into the app and written to BUILDINFO.txt (FK-014)
  FK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FK_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FK_SOURCE_SHA }}
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      - name: Version
        run: echo "VER=$(tr -d ' \n' < VERSION)" >> "$GITHUB_ENV"
      - name: Toolchain id (dependency cache key)
        id: tc
        # static deps record absolute SDK paths (e.g. libm.tbd inside one Xcode), so a cache is only valid for the
        # runner image and SDK it was built with
        run: |
          if [ "$RUNNER_OS" = macOS ]; then id="${ImageOS}-$(xcrun --show-sdk-path | sed 's#.*/##; s#[^A-Za-z0-9.]#_#g')-$(xcode-select -p | sed 's#/Contents/Developer##; s#.*/##')"
          else id="${ImageOS:-unknown}"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "toolchain id: $id"
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-install
          key: deps-macos-universal-${{ steps.tc.outputs.id }}-${{ hashFiles('cmake/deps/**') }}
      - name: Dependencies (arm64 + x86_64)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/deps -B build/deps -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_DEPS_WITH_TESTS=OFF \
            -DFK_DEPS_PREFIX="$PWD/build/deps-install" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build/deps
      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_BUILD_TESTS=OFF -DFK_WERROR=ON \
            -DFK_GIT_SHA="$FK_SOURCE_SHA" -DFK_BUILD_ID="$FK_BUILD_ID" \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-install;$QT_ROOT_DIR" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" 2>&1 | tee build/rel-build.log
          cmake --build build/rel -- -k 0 2>&1 | tee -a build/rel-build.log
      - name: Build errors as annotations
        if: failure()
        run: python3 tools/ci-annotate.py build/rel-build.log
      - name: Package DMG
        run: |
          set -o pipefail
          tools/release/package-macos.sh build/rel dist "$VER" 2>&1 | tee build/package.log
      - name: The DMG as a user meets it — mount, check, copy, run; upgrade, rollback (FK-014)
        env:
          GH_TOKEN: ${{ github.token }}
          FK_TEST_WORK: ${{ github.workspace }}/build/install-test
        run: |
          set -o pipefail
          lipo -info build/rel/bin/FrameKeeper.app/Contents/MacOS/FrameKeeper
          build/rel/bin/fkfixture --out build/smoke.tif --dpi 300 --count 3 --seed 5
          tools/release/test-macos-dmg.sh "dist/FrameKeeper-$VER-macOS-universal.dmg" "$VER" "$FK_SOURCE_SHA" \
            build/smoke.tif 2>&1 | tee build/smoke.log
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS-macos.txt && shasum -a 256 -c SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt)
      - name: Packaging/smoke test failures as annotations
        if: failure()
        run: |
          for f in build/package.log build/smoke.log; do [ -f "$f" ] && python3 tools/ci-annotate.py "$f"; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
            dist/BUILDINFO-macos.txt
            build/install-test/st-installed/report.json
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FK_SOURCE_SHA }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Version
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Toolchain id (dependency cache key)
        id: tc
        # static deps record absolute SDK paths (e.g. libm.tbd inside one Xcode), so a cache is only valid for the
        # runner image and SDK it was built with
        run: |
          if [ "$RUNNER_OS" = macOS ]; then id="${ImageOS}-$(xcrun --show-sdk-path | sed 's#.*/##; s#[^A-Za-z0-9.]#_#g')-$(xcode-select -p | sed 's#/Contents/Developer##; s#.*/##')"
          else id="${ImageOS:-unknown}"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "toolchain id: $id"
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-install
          key: deps-windows-x64-rel-${{ steps.tc.outputs.id }}-${{ hashFiles('cmake/deps/**') }}
      - name: Dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/deps -B build/deps -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_DEPS_WITH_TESTS=OFF \
            -DFK_DEPS_PREFIX="$PWD/build/deps-install"
          cmake --build build/deps
      - name: Build
        run: |
          set -o pipefail
          np() { cygpath -m "$1"; }  # a ';' list is not converted by Git Bash, so pass C:/… paths
          mkdir -p build
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DFK_BUILD_TESTS=OFF -DFK_WERROR=ON \
            -DFK_GIT_SHA="$FK_SOURCE_SHA" -DFK_BUILD_ID="$FK_BUILD_ID" \
            "-DCMAKE_PREFIX_PATH=$(np "$PWD/build/deps-install");$(np "$QT_ROOT_DIR")" 2>&1 | tee build/rel-build.log
          cmake --build build/rel -- -k 0 2>&1 | tee -a build/rel-build.log
      - name: Build errors as annotations
        if: failure()
        run: python tools/ci-annotate.py build/rel-build.log
      - name: Package ZIP and installer
        run: |
          set -o pipefail
          tools/release/package-windows.sh build/rel dist "$VER" 2>&1 | tee build/package.log
      - name: The portable ZIP as a user meets it — unpack, check, run (no Qt on PATH) (FK-014)
        run: |
          set -o pipefail
          build/rel/bin/fkfixture.exe --out build/smoke.tif --dpi 300 --count 3 --seed 5
          7z x -y -obuild/zip "dist/FrameKeeper-$VER-Windows-x64-portable.zip" > /dev/null
          python tools/release/check-package.py windows build/zip/FrameKeeper "$VER" "$FK_SOURCE_SHA" | tee build/smoke.log
          PATH="/c/Windows/system32:/c/Windows" QT_QPA_PLATFORM=offscreen FK_SETTINGS_DIR="$PWD/build/smoke-settings" \
            build/zip/FrameKeeper/FrameKeeper.exe --self-test "$PWD/build/smoke" --scan "$PWD/build/smoke.tif" 2>&1 | tee -a build/smoke.log
          python tools/release/check-report.py build/smoke/report.json "$VER" "$FK_SOURCE_SHA" | tee -a build/smoke.log
      - name: The installer — install, upgrade from published releases, rollback, uninstall (FK-014)
        env:
          GH_TOKEN: ${{ github.token }}
          FK_TEST_WORK: ${{ github.workspace }}/build/install-test
        run: |
          set -o pipefail
          tools/release/test-windows-install.sh dist "$VER" "$FK_SOURCE_SHA" build/smoke.tif 2>&1 | tee build/install.log
          (cd dist && sha256sum *.zip *Setup.exe > SHA256SUMS-windows.txt && sha256sum -c SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt)
      - name: Packaging/smoke test failures as annotations
        if: failure()
        run: |
          for f in build/package.log build/smoke.log build/install.log; do [ -f "$f" ] && python tools/ci-annotate.py "$f"; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*Setup.exe
            dist/SHA256SUMS-windows.txt
            dist/BUILDINFO-windows.txt
            build/smoke/report.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, windows]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the compare link
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and checksums
        run: |
          VER=$(tr -d ' \n' < VERSION)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*Setup.exe' -o -name 'BUILDINFO-*.txt' \) \
            -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          NOTES="docs/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "::error::missing $NOTES"; exit 1; }
          # history is never rewritten: an existing tag or release means VERSION was not bumped
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already exists; bump VERSION for a new release instead of overwriting"; exit 1
          fi
          TITLE=$(head -1 "$NOTES" | sed 's/^# *//')
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            cat "$NOTES"
            echo
            echo "---"
            echo "## Build"
            echo "- Version: \`$VER\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build: \`$FK_BUILD_ID\` ([workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            if [ -n "$PREV" ]; then echo "- Changes since $PREV: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...$TAG"; fi
            echo "- Signing: not code-signed, not notarised (see docs/INSTALL.md)"
            echo
            echo "## SHA-256"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > body.md
          PRE=""
          case "$VER" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file body.md $PRE
      - name: Verify the published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir verify
          gh release download "v$VER" -D verify
          (cd verify && sha256sum -c SHA256SUMS.txt)
          git fetch --tags -q && test "$(git rev-parse "v$VER^{commit}")" = "$GITHUB_SHA"
